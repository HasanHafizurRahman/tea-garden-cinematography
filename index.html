                const activeScene = getCurrentScene(t);
                if (hudCutTitle) hudCutTitle.textContent = activeScene.title;
                if (hudCamMeta) hudCamMeta.textContent = `${activeScene.lensMeta} • ${LUT_MODES[appState.lutIdx].name.toUpperCase()}`;

                cutChipBtns.forEach(btn => {
                    const cid = parseInt(btn.getAttribute("data-cut"), 10);
                    btn.classList.toggle("active-cut", cid === activeScene.id);
                });

                if (appState.playing) {
                    playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                    playLabel.textContent = "Pause";
                } else {
                    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                    playLabel.textContent = "Play";
                }
            }

            function renderFrame(t) {
                ctx.clearRect(0, 0, CW, CH);
                if (t < 5.0) {
                    renderCut1And6TillaPanorama(ctx, t, false);
                } else if (t < 10.0) {
                    renderCut2TeaPluckers(ctx, t);
                } else if (t < 15.0) {
                    renderCut3JhiriStream(ctx, t);
                } else if (t < 20.0) {
                    renderCut4MuddyRoadAndTractor(ctx, t);
                } else if (t < 25.0) {
                    renderCut5HilltopBungalow(ctx, t);
                } else {
                    renderCut1And6TillaPanorama(ctx, t, true);
                }
                renderPostProcessingAndHUD(ctx, t, appState);
            }

            function tick(ts) {
                if (!appState.lastFrameTs) appState.lastFrameTs = ts;
                const rawDt = (ts - appState.lastFrameTs) / 1000;
                appState.lastFrameTs = ts;
                const dt = clamp(rawDt, 0.001, 0.1);

                if (appState.playing && !appState.isScrubbing) {
                    appState.currentTime += dt;
                    if (appState.currentTime >= TOTAL_DURATION) {
                        appState.currentTime = TOTAL_DURATION;
                        appState.playing = false;
                        sound.pause();
                    }
                    sound.update(appState.currentTime, dt);
                }

                renderFrame(appState.currentTime);
                updateUIControls();
                requestAnimationFrame(tick);
            }

            function startExperience(jumpTime = null) {
                sound.init();
                sound.resume();
                appState.started = true;
                if (jumpTime !== null) {
                    appState.currentTime = clamp(jumpTime, 0, TOTAL_DURATION);
                    sound.resetCues(appState.currentTime);
                } else if (appState.currentTime >= TOTAL_DURATION - 0.15) {
                    appState.currentTime = 0;
                    sound.resetCues(0);
                }
                appState.playing = true;
                startOverlay.classList.add("hidden");
                updateUIControls();
            }

            function togglePlayPause() {
                if (!appState.started) {
                    startExperience();
                    return;
                }
                if (appState.playing) {
                    appState.playing = false;
                    sound.pause();
                } else {
                    if (appState.currentTime >= TOTAL_DURATION - 0.1) {
                        appState.currentTime = 0;
                        sound.resetCues(0);
                    }
                    appState.playing = true;
                    sound.init();
                    sound.resume();
                }
                updateUIControls();
            }

            function seekTo(newTime) {
                appState.currentTime = clamp(newTime, 0, TOTAL_DURATION);
                sound.resetCues(appState.currentTime);
                renderFrame(appState.currentTime);
                updateUIControls();
            }

            tapStartBtn.addEventListener("click", () => startExperience(null));
            canvas.addEventListener("click", togglePlayPause);
            playPauseBtn.addEventListener("click", togglePlayPause);

            cutChipBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const jt = parseFloat(btn.getAttribute("data-jump"));
                    if (!appState.started) {
                        startExperience(jt);
                    } else {
                        seekTo(jt);
                    }
                });
            });

            overlayScenePills.forEach(pill => {
                pill.addEventListener("click", () => {
                    const jt = parseFloat(pill.getAttribute("data-jump"));
                    startExperience(jt);
                });
            });

            restartBtn.addEventListener("click", () => {
                sound.init();
                seekTo(0);
                appState.playing = true;
                appState.started = true;
                startOverlay.classList.add("hidden");
                sound.resume();
                updateUIControls();
            });

            filmLookBtn.addEventListener("click", () => {
                appState.lutIdx = (appState.lutIdx + 1) % LUT_MODES.length;
                filmLookBtn.classList.toggle("active-mode", appState.lutIdx !== 0);
                filmLookLabel.textContent = `LUT: ${LUT_MODES[appState.lutIdx].name}`;
                renderFrame(appState.currentTime);
                updateUIControls();
            });

            camGuideBtn.addEventListener("click", () => {
                appState.showCinemaGuides = !appState.showCinemaGuides;
                camGuideBtn.classList.toggle("active-mode", appState.showCinemaGuides);
                renderFrame(appState.currentTime);
            });

            muteBtn.addEventListener("click", () => {
                const muted = sound.toggleMute();
                muteLabel.textContent = muted ? "Muted" : "Audio";
                document.getElementById("vol-icon").innerHTML = muted
                    ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
                    : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
            });

            volumeSlider.addEventListener("input", (e) => {
                const val = parseFloat(e.target.value);
                if (sound.isMuted && val > 0) {
                    sound.toggleMute();
                    muteLabel.textContent = "Audio";
                }
                sound.setVolume(val);
            });

            timelineSlider.addEventListener("mousedown", () => { appState.isScrubbing = true; });
            timelineSlider.addEventListener("touchstart", () => { appState.isScrubbing = true; }, { passive: true });
            timelineSlider.addEventListener("input", (e) => {
                seekTo(parseFloat(e.target.value));
            });
            timelineSlider.addEventListener("change", (e) => {
                appState.isScrubbing = false;
                seekTo(parseFloat(e.target.value));
            });
            window.addEventListener("mouseup", () => { appState.isScrubbing = false; });
            window.addEventListener("touchend", () => { appState.isScrubbing = false; });

            fullscreenBtn.addEventListener("click", () => {
                const elem = document.getElementById("stage-wrapper");
                if (!document.fullscreenElement) {
                    if (elem.requestFullscreen) elem.requestFullscreen().catch(() => { });
                } else {
                    if (document.exitFullscreen) document.exitFullscreen().catch(() => { });
                }
            });

            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();
                    togglePlayPause();
                } else if (e.code === "KeyM") {
                    muteBtn.click();
                } else if (e.code === "KeyF") {
                    fullscreenBtn.click();
                } else if (e.code === "KeyL") {
                    filmLookBtn.click();
                } else if (e.code === "KeyC") {
                    camGuideBtn.click();
                } else if (e.code === "Digit1") {
                    seekTo(0);
                } else if (e.code === "Digit2") {
                    seekTo(5);
                } else if (e.code === "Digit3") {
                    seekTo(10);
                } else if (e.code === "Digit4") {
                    seekTo(15);
                } else if (e.code === "Digit5") {
                    seekTo(20);
                } else if (e.code === "Digit6") {
                    seekTo(25);
                } else if (e.code === "ArrowRight") {
                    seekTo(appState.currentTime + 2.5);
                } else if (e.code === "ArrowLeft") {
                    seekTo(appState.currentTime - 2.5);
                }
            });

            let idleTimer = null;
            function resetIdleTimer() {
                viewport.classList.remove("idle-cursor");
                if (idleTimer) clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    if (appState.playing) viewport.classList.add("idle-cursor");
                }, 3200);
            }
            viewport.addEventListener("mousemove", resetIdleTimer);
            viewport.addEventListener("touchstart", resetIdleTimer, { passive: true });

            window.addEventListener("load", () => {
                preRenderAllTillaLayers();
                renderFrame(0);
                updateUIControls();
                requestAnimationFrame(tick);
            });
        })();
    </script>
</body>

</html>
