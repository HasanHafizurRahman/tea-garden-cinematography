<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>সিলেটের চা বাগান — টিলা, ঝিরি ও দুটি পাতা একটি কুঁড়ি (Tea Garden 6-Cut Cinematic Short)</title>
    <style>
        :root {
            --bg-dark: #070b09;
            --panel-bg: rgba(9, 15, 12, 0.82);
            --accent: #a7e163;
            --accent-gold: #f0b85c;
            --accent-soft: rgba(167, 225, 99, 0.22);
            --text-main: #f3f7ee;
            --text-muted: #b8c9b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Noto Sans Bengali", sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #stage-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #111d16 0%, #050806 100%);
        }

        #viewport {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * (16 / 9));
            max-height: calc(100vw * (9 / 16));
            aspect-ratio: 16 / 9;
            background: #0c140f;
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.92), 0 0 0 1px rgba(210, 235, 195, 0.14);
            overflow: hidden;
            border-radius: 6px;
        }

        canvas#film-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        /* Start Screen Overlay */
        #start-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(6, 14, 10, 0.42) 0%, rgba(4, 9, 6, 0.88) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 35;
            padding: 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
        }

        #start-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-card {
            position: relative;
            max-width: 520px;
            width: 100%;
            margin: auto;
            background: rgba(10, 18, 13, 0.72);
            border: 1px solid rgba(167, 225, 99, 0.22);
            border-radius: 24px;
            padding: clamp(28px, 4.5vw, 44px) clamp(20px, 4.5vw, 40px);
            box-shadow: 0 36px 90px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: startCardFade 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes startCardFade {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .film-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #bbf477;
            background: rgba(167, 225, 99, 0.1);
            border: 1px solid rgba(167, 225, 99, 0.28);
            padding: 5px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }

        .film-kicker-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #a7e163;
            box-shadow: 0 0 8px #a7e163;
            animation: pulseDot 2s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 12px #a7e163; }
        }

        .film-title-bn {
            font-size: clamp(26px, 4.4vw, 42px);
            font-weight: 700;
            font-family: "Noto Serif Bengali", "SolaimanLipi", Georgia, serif;
            color: #f7fbf2;
            background: linear-gradient(180deg, #ffffff 30%, #e2f4cd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
            margin-bottom: 4px;
            letter-spacing: 0.02em;
            line-height: 1.25;
        }

        .film-title-en {
            font-size: clamp(14px, 1.8vw, 17px);
            font-weight: 400;
            font-family: Georgia, "Times New Roman", serif;
            font-style: italic;
            color: #f0b85c;
            letter-spacing: 0.05em;
            margin-bottom: 14px;
        }

        .film-divider {
            width: 44px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(240, 184, 92, 0.65), transparent);
            margin-bottom: 14px;
        }

        .film-desc {
            max-width: 420px;
            font-size: clamp(12.5px, 1.3vw, 14px);
            line-height: 1.6;
            color: rgba(228, 238, 220, 0.82);
            margin-bottom: 26px;
            font-weight: 300;
        }

        #tap-start-btn {
            display: inline-flex;
            align-items: center;
            gap: 13px;
            padding: 6px 20px 6px 8px;
            color: #f4fbf0;
            background: rgba(167, 225, 99, 0.12);
            border: 1px solid rgba(167, 225, 99, 0.38);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #tap-start-btn .btn-play-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d8f8a0 0%, #8cd147 65%, #5ea425 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #07130a;
            box-shadow: 0 4px 16px rgba(140, 209, 71, 0.45);
            transition: transform 0.24s ease, box-shadow 0.24s ease;
        }

        #tap-start-btn .btn-play-circle svg {
            margin-left: 2px;
        }

        #tap-start-btn .btn-play-text {
            font-size: 14.5px;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        #tap-start-btn .btn-runtime-badge {
            font-size: 10.5px;
            font-weight: 500;
            color: rgba(216, 248, 160, 0.9);
            background: rgba(6, 14, 9, 0.55);
            border: 1px solid rgba(167, 225, 99, 0.22);
            padding: 3px 8px;
            border-radius: 999px;
            margin-left: 2px;
        }

        #tap-start-btn:hover {
            transform: translateY(-2px) scale(1.02);
            background: rgba(167, 225, 99, 0.22);
            border-color: rgba(167, 225, 99, 0.65);
            box-shadow: 0 16px 38px rgba(140, 209, 71, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        #tap-start-btn:hover .btn-play-circle {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(140, 209, 71, 0.65);
        }

        #tap-start-btn:active {
            transform: translateY(0) scale(0.99);
        }

        /* Top HUD: Active Audio Cues */
        #hud-top {
            position: absolute;
            top: 12px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            pointer-events: none;
            z-index: 22;
            transition: opacity 0.45s ease;
        }

        #camera-telemetry-badge {
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: rgba(8, 14, 11, 0.68);
            border: 1px solid rgba(167, 225, 99, 0.32);
            padding: 6px 12px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .cam-cut-name {
            font-size: 12px;
            font-weight: 600;
            color: #e4f8c4;
            letter-spacing: 0.02em;
        }

        .cam-lens-meta {
            font-size: 10.5px;
            color: #f0b85c;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #active-audio-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 50%;
        }

        .audio-cue-chip {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(18, 32, 22, 0.78);
            border: 1px solid rgba(167, 225, 99, 0.5);
            color: #d8f8a0;
            animation: fadePulse 0.25s ease-out;
        }

        @keyframes fadePulse {
            from {
                transform: scale(0.9);
                opacity: 0.4;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Bottom Controls Bar */
        #controls-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, rgba(6, 11, 8, 0.94) 0%, rgba(6, 11, 8, 0.72) 72%, transparent 100%);
            padding: 16px 16px 11px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            z-index: 25;
            transition: opacity 0.4s ease;
        }

        #viewport.idle-cursor #controls-bar,
        #viewport.idle-cursor #hud-top {
            opacity: 0.14;
        }

        #controls-bar:hover,
        #hud-top:hover {
            opacity: 1 !important;
        }

        /* Interactive Cut Jump Bar */
        .cut-jump-row {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }

        .cut-jump-row::-webkit-scrollbar {
            display: none;
        }

        .cut-chip-btn {
            background: rgba(14, 24, 18, 0.72);
            border: 1px solid rgba(210, 235, 195, 0.18);
            color: var(--text-muted);
            font-size: 10.5px;
            padding: 3px 9px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.16s ease;
        }

        .cut-chip-btn:hover {
            background: rgba(167, 225, 99, 0.18);
            color: #ffffff;
            border-color: rgba(167, 225, 99, 0.45);
        }

        .cut-chip-btn.active-cut {
            background: rgba(167, 225, 99, 0.26);
            color: #e4f8c4;
            border-color: rgba(167, 225, 99, 0.75);
            font-weight: 600;
        }

        /* Timeline Slider */
        .timeline-container {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        #timeline-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: linear-gradient(90deg,
                    rgba(122, 198, 92, 0.42) 0%,
                    rgba(88, 178, 110, 0.42) 33%,
                    rgba(76, 165, 178, 0.42) 50%,
                    rgba(218, 146, 78, 0.42) 75%,
                    rgba(240, 172, 72, 0.48) 100%);
            outline: none;
            cursor: pointer;
        }

        #timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #d8f8a0;
            box-shadow: 0 0 10px rgba(167, 225, 99, 0.95);
            cursor: pointer;
        }

        /* Controls Row */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .ctrl-btn {
            background: rgba(13, 21, 16, 0.76);
            border: 1px solid rgba(220, 240, 210, 0.2);
            color: var(--text-main);
            height: 31px;
            padding: 0 11px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .ctrl-btn:hover {
            background: rgba(167, 225, 99, 0.22);
            border-color: rgba(167, 225, 99, 0.5);
            color: #ffffff;
        }

        .ctrl-btn.active-mode {
            background: rgba(240, 184, 92, 0.25);
            border-color: rgba(240, 184, 92, 0.7);
            color: #ffe2a8;
        }

        .ctrl-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .time-readout {
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            color: #d8f8a0;
            margin-left: 4px;
        }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 74px;
            height: 5px;
            border-radius: 999px;
            background: rgba(243, 247, 238, 0.25);
            outline: none;
            cursor: pointer;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d8f8a0;
            cursor: pointer;
        }

        @media (max-width: 680px), (max-height: 600px) {
            #start-overlay {
                padding: 16px;
            }

            .start-card {
                padding: 22px 18px 20px;
                border-radius: 20px;
                max-width: 420px;
            }

            .film-kicker {
                font-size: 9.5px;
                letter-spacing: 0.22em;
                padding: 4px 12px;
                margin-bottom: 12px;
            }

            .film-title-bn {
                font-size: clamp(22px, 6vw, 30px);
                margin-bottom: 3px;
            }

            .film-title-en {
                font-size: clamp(12.5px, 3.6vw, 15px);
                margin-bottom: 10px;
            }

            .film-divider {
                width: 36px;
                margin-bottom: 10px;
            }

            .film-desc {
                font-size: 12px;
                line-height: 1.5;
                margin-bottom: 18px;
                max-width: 320px;
            }

            #tap-start-btn {
                padding: 5px 16px 5px 6px;
                gap: 10px;
            }

            #tap-start-btn .btn-play-circle {
                width: 36px;
                height: 36px;
            }

            #tap-start-btn .btn-play-circle svg {
                width: 16px;
                height: 16px;
            }

            #tap-start-btn .btn-play-text {
                font-size: 13.5px;
            }

            #tap-start-btn .btn-runtime-badge {
                font-size: 9.5px;
                padding: 2px 7px;
            }

            #controls-bar {
                padding: 10px 10px 8px;
                gap: 5px;
            }

            .ctrl-btn {
                height: 28px;
                padding: 0 8px;
                font-size: 11px;
            }

            .ctrl-btn span.btn-label {
                display: none;
            }

            #volume-slider {
                width: 46px;
            }
        }
    </style>
</head>

<body>

    <div id="stage-wrapper">
        <div id="viewport">
            <canvas id="film-canvas" width="1600" height="900"></canvas>

            <!-- Top HUD: Active Audio Cue Chips -->
            <div id="hud-top">
                <div id="active-audio-tags"></div>
            </div>

            <!-- Bottom Controls -->
            <div id="controls-bar">
                <div class="timeline-container">
                    <input type="range" id="timeline-slider" min="0" max="30" step="0.02" value="0"
                        aria-label="Film Timeline">
                </div>

                <div class="controls-row">
                    <div class="controls-group">
                        <button type="button" class="ctrl-btn" id="play-pause-btn" aria-label="Play or Pause">
                            <svg id="play-icon" viewBox="0 0 24 24">
                                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                            </svg>
                            <span class="btn-label" id="play-label">Pause</span>
                        </button>
                        <button type="button" class="ctrl-btn" id="restart-btn" aria-label="Restart">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                            </svg>
                            <span class="btn-label">Restart</span>
                        </button>
                        <button type="button" class="ctrl-btn" id="film-look-btn"
                            aria-label="Cycle Cinema Color Grade LUT">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8z" />
                            </svg>
                            <span class="btn-label" id="film-look-label">LUT: Sylhet Emerald</span>
                        </button>
                        <button type="button" class="ctrl-btn" id="cam-guide-btn"
                            aria-label="Toggle Cinema Viewfinder Guides">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2z" />
                            </svg>
                            <span class="btn-label" id="cam-guide-label">2.39:1 Frame</span>
                        </button>
                        <span class="time-readout" id="time-display">0:00 / 0:30</span>
                    </div>

                    <div class="controls-group">
                        <button type="button" class="ctrl-btn" id="mute-btn" aria-label="Mute or Unmute">
                            <svg id="vol-icon" viewBox="0 0 24 24">
                                <path
                                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                            </svg>
                            <span class="btn-label" id="mute-label">Audio</span>
                        </button>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.85"
                            aria-label="Master Volume">
                        <button type="button" class="ctrl-btn" id="fullscreen-btn" aria-label="Fullscreen">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                            </svg>
                            <span class="btn-label">Fullscreen</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Start Screen Overlay -->
        <div id="start-overlay">
            <div class="start-card">
                <div class="film-kicker">
                    <span class="film-kicker-dot"></span>
                    Sylhet Tea Garden Cinema
                </div>
                <h1 class="film-title-bn">সবুজ টিলার কাব্য</h1>
                <div class="film-title-en">Whispers of the Tea Tillas</div>
                <div class="film-divider"></div>
                <p class="film-desc">টিলা, ঝিরি ও দুটি পাতা একটি কুঁড়ির মেলবন্ধন — সিলেটের চা বাগানের এক নিসর্গ চিত্রনাট্য</p>
                <button id="tap-start-btn" type="button" aria-label="Play Tea Garden Film">
                    <span class="btn-play-circle">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </span>
                    <span class="btn-play-text">Play Film</span>
                    <span class="btn-runtime-badge">0:30 Reel</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        (() => {
            "use strict";

            // ============================================================================
            // 0. CINEMATIC MASTER RULES CONTRACT (GOVERNANCE FOR ALL FUTURE MODIFICATIONS)
            // ============================================================================
            const CINEMATIC_MASTER_RULES = Object.freeze({
                version: "3.1-SYLHET-JHIRI-STREAM-REALISM",
                aspectRatio: "16:9 (1600x900 internal render buffer) with optional 2.39:1 Anamorphic mattes",
                pacingStandard: "Fast-paced viral travel cinematography: 5.0 seconds per cut (30.0s total across 6 cuts) with brisk, continuous camera motion.",
                botanicalRealism: {
                    individualTeaBushes: "NEVER render Tillas as flat painted stripes. Every Tilla must be populated with hundreds of discrete, individually visible Camellia sinensis tea bushes.",
                    teaPlantAnatomy: "Each individual tea bush must exhibit: (1) gnarled branched woody stems & root collar at the base, (2) deep under-bush shadow on red-laterite soil terraces, (3) 200+ individual pointed elliptical tea leaves with midrib veins across 5 depth tiers, and (4) a pruned flat/domed plucking-table crown studded with upright 'Duti Pata Ekti Kuri' lime shoots.",
                    shadeTrees: "Tall silver-barked Koroi (Albizia) and Krishnachura shade trees tower above the tea bushes with feathery horizontal foliage tiers and dappled ground shadows."
                },
                culturalAuthenticity: {
                    teaPluckers: "Female tea garden workers wear vibrant cotton saris/blouses with woven conical bamboo Tukri baskets suspended on their backs via a taut forehead strap (Mathar Fita).",
                    jhiriStream: "Mountain Jhiri streams feature an upper rock-ledge cascade, crystal-clear water with underwater sun caustics, 3D shaded sandstone pebbles, darting silver minnows, sculpted mossy boulders with hydrodynamic wakes, an arched A-frame bamboo footbridge (Basher Shako), bamboo groves, and lush taro/fern banks.",
                    estateTractor: "Muddy red-laterite roads (Lal Matir Rasta) feature rutted wheel tracks, rainwater puddles, and a rugged estate tractor hauling a trailer piled high with bulging green tea leaf sacks.",

            // ============================================================================
            // 1. DETERMINISTIC PRNG, 2D PERLIN/FBM NOISE FIELD & COLOR GRADING UTILITIES
            // ============================================================================
            function mulberry32(seed = 19980412) {
                let a = seed >>> 0;
                return function () {
                    a |= 0;
                    a = (a + 0x6D2B79F5) | 0;
                    let t = Math.imul(a ^ (a >>> 15), 1 | a);
                    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            const PERM = new Uint8Array(512);
            const GRAD = new Float32Array(256);
            {
                const nRng = mulberry32(771995);
                const p = new Uint8Array(256);
                for (let i = 0; i < 256; i++) {
                    p[i] = i;
                    GRAD[i] = nRng() * 2 - 1;
                }
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(nRng() * (i + 1));
                    const tmp = p[i];
                    p[i] = p[j];
                    p[j] = tmp;
                }
                for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
            }

            const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
            const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
            const lerp = (a, b, t) => a + (b - a) * clamp(t, 0, 1);
            const smoothstep = (e0, e1, x) => {
                const t = clamp((x - e0) / (e1 - e0), 0, 1);
                return t * t * (3 - 2 * t);
            };
            const easeInOutCubic = (t) => {
                t = clamp(t, 0, 1);
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            };

            function noise2D(x, y) {
                const xi = Math.floor(x) & 255;
                const yi = Math.floor(y) & 255;
                const xf = x - Math.floor(x);
                const yf = y - Math.floor(y);
                const u = fade(xf);
                const v = fade(yf);
                const aa = PERM[PERM[xi] + yi];
                const ab = PERM[PERM[xi] + yi + 1];
                const ba = PERM[PERM[xi + 1] + yi];
                const bb = PERM[PERM[xi + 1] + yi + 1];
                return lerp(lerp(GRAD[aa], GRAD[ba], u), lerp(GRAD[ab], GRAD[bb], u), v);
            }

                const u = clamp(t, 0, 1);
                const r = Math.round(lerp(c1[0], c2[0], u));
                const g = Math.round(lerp(c1[1], c2[1], u));
                const b = Math.round(lerp(c1[2], c2[2], u));
                return `rgb(${r},${g},${b})`;
            }

                        o1.type = "sawtooth";
                        o2.type = "sawtooth";
                        o1.frequency.setValueAtTime(315, t0);
                        o2.frequency.setValueAtTime(395, t0);

                        filt.type = "bandpass";
                        filt.frequency.setValueAtTime(920, t0);
                        filt.Q.setValueAtTime(2.5, t0);

                        g.gain.setValueAtTime(0.0001, t0);
                        g.gain.linearRampToValueAtTime(0.14, t0 + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

                        o1.connect(filt);
                        o2.connect(filt);
                        filt.connect(g);
                        g.connect(panner);

                        o1.start(t0);
                        o2.start(t0);
                        o1.stop(t0 + dur + 0.02);
                        o2.stop(t0 + dur + 0.02);
                    });
                    this.showAudioTag("ট্রাক্টরের হর্ন · Estate Tractor Horn");
                }

                playEstateGong(panVal = 0.35) {
                    if (!this.initialized || this.ctx.state !== "running") return;
                    const now = this.ctx.currentTime;
                    const panner = this.ctx.createStereoPanner();
                    panner.pan.setValueAtTime(panVal, now);
                    panner.connect(this.compressor);

                    [440, 880, 1318.5].forEach((f, i) => {
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.type = "sine";
                        o.frequency.setValueAtTime(f, now);
                        g.gain.setValueAtTime(0.0001, now);
                        g.gain.linearRampToValueAtTime(0.09 / (i + 1), now + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.8 - i * 0.3);
                        o.connect(g);
                        g.connect(panner);
                        o.start(now);
                        o.stop(now + 1.9);
                    });
                    this.showAudioTag("চা কারখানার ঘণ্টা · Tea Factory Bell");
                }

                update(t, dt) {
                    if (!this.initialized || this.ctx.state !== "running") return;
                    const now = this.ctx.currentTime;

                    for (const cue of TIMELINE_AUDIO_CUES) {
                        if (t >= cue.t && !this.firedCues.has(cue.id)) {
                            this.firedCues.add(cue.id);
                            cue.action(this);
                        }
                    }

                    if (t >= this.nextBirdTime && (t < 15.0 || t > 20.0)) {
                        const types = ["doel", "koel", "kingfisher", "doel"];
                        const choice = (t >= 10 && t < 15) ? "kingfisher" : types[Math.floor((t * 5.7) % types.length)];
                        const pan = Math.sin(t * 1.4) * 0.65;
                        this.playBird(choice, pan, t > 25 ? 0.09 : 0.12);
                        this.nextBirdTime = t + 2.1 + (t % 1.1);
                    }

                    if (t >= 5.1 && t <= 9.85 && t >= this.nextPluckTime) {
                        this.playTeaPluckSnap(Math.sin(t * 2.9) * 0.45);
                        this.nextPluckTime = t + 0.68 + (t % 0.32);
                    }

                    if (t >= 10.1 && t <= 14.85 && t >= this.nextSplashTime) {
                        this.playWaterDropletSplash(Math.sin(t * 3.7) * 0.55);
                        this.nextSplashTime = t + 0.55 + (t % 0.35);
                    }

                    const isPluckCut = (t >= 5.0 && t < 10.0);
                    const isJhiriCut = (t >= 10.0 && t < 15.0);
                    const isTractorCut = (t >= 15.0 && t < 20.0);
                    const isDuskCut = (t >= 25.0);

                    this.leafRustleGain.gain.setTargetAtTime(isPluckCut ? 0.032 : 0.0001, now, 0.12);
                    this.jhiriGain.gain.setTargetAtTime(isJhiriCut ? 0.22 : 0.0001, now, 0.15);
                    this.jhiriPan.pan.setTargetAtTime(isJhiriCut ? Math.sin(t * 1.2) * 0.25 : 0.0, now, 0.15);
                    this.cricketGain.gain.setTargetAtTime(isDuskCut ? 0.018 : 0.0001, now, 0.2);

                    if (isTractorCut) {
                        const u = clamp((t - 15.0) / 5.0, 0, 1);
                        const env = smoothstep(15.0, 15.6, t) * (1 - smoothstep(19.3, 20.0, t));
                        const pan = lerp(-0.75, 0.78, u);
                        const rpm = 1.0 + Math.sin(u * Math.PI) * 0.38 + Math.sin(t * 14) * 0.05;
                        this.tractorPan.pan.setTargetAtTime(pan, now, 0.06);
                        this.tractorGain.gain.setTargetAtTime(0.24 * env, now, 0.08);
                        this.mudSquelchGain.gain.setTargetAtTime(0.085 * env, now, 0.08);
                        this.tractorOsc1.frequency.setTargetAtTime(42 * rpm, now, 0.06);
                        this.tractorOsc2.frequency.setTargetAtTime(21 * rpm, now, 0.06);
                        this.tractorLfo.frequency.setTargetAtTime(9.2 * rpm, now, 0.06);
                    } else {
                        this.tractorGain.gain.setTargetAtTime(0.0001, now, 0.12);
                        this.mudSquelchGain.gain.setTargetAtTime(0.0001, now, 0.12);
                    }
                }
            }

            // ============================================================================
            // 4. HYPER-DETAILED INDIVIDUAL TEA PLANT (CAMELLIA SINENSIS) SPRITE ENGINE

            function createOffscreen(w, h) {
                const c = document.createElement("canvas");
                c.width = w;
                c.height = h;
                return c;
            }

            function drawSingleTeaLeaf(ctx, x, y, len, wid, angle, fillCol, veinCol) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.fillStyle = fillCol;
                ctx.beginPath();
                ctx.moveTo(-len * 0.45, 0);
                ctx.quadraticCurveTo(-len * 0.05, -wid, len * 0.55, 0);
                ctx.quadraticCurveTo(-len * 0.05, wid, -len * 0.45, 0);
                ctx.closePath();
                ctx.fill();

                if (veinCol) {
                    ctx.strokeStyle = veinCol;
                    ctx.lineWidth = Math.max(0.6, wid * 0.16);
                    ctx.beginPath();
                    ctx.moveTo(-len * 0.36, 0);
                    ctx.lineTo(len * 0.44, 0);
                    ctx.stroke();
                }
                ctx.restore();
            }

            function createDetailedTeaBushSprite(w, h, seed, isDusk = false) {
                const c = createOffscreen(w, h);
                const bctx = c.getContext("2d");
                const rng = mulberry32(seed);

                const cx = w * 0.5;
                const baseY = h * 0.88;
                const rx = w * 0.43;
                const ry = h * 0.36;
                const crownY = h * 0.48;

                const shGrad = bctx.createRadialGradient(cx, baseY - 2, rx * 0.15, cx, baseY - 2, rx * 0.98);
                shGrad.addColorStop(0, "rgba(6, 12, 8, 0.82)");
                shGrad.addColorStop(0.65, "rgba(12, 18, 10, 0.48)");
                shGrad.addColorStop(1, "rgba(12, 18, 10, 0)");
                bctx.fillStyle = shGrad;
                bctx.beginPath();
                bctx.ellipse(cx, baseY - 2, rx * 0.96, h * 0.11, 0, 0, Math.PI * 2);
                bctx.fill();

                const stemOffsets = [-rx * 0.42, -rx * 0.20, 0, rx * 0.22, rx * 0.40];
                stemOffsets.forEach((sox, idx) => {
                    const baseSpread = sox * 0.55 + (rng() - 0.5) * 5;
                    const topSpread = sox * 0.92 + (rng() - 0.5) * 6;
                    bctx.strokeStyle = idx % 2 === 0 ? "#3d2719" : "#543824";
                    bctx.lineWidth = 3.2 - Math.abs(sox / rx) * 1.2;
                    bctx.lineCap = "round";
                    bctx.beginPath();
                    bctx.moveTo(cx + baseSpread, baseY - 1);
                    bctx.quadraticCurveTo(cx + (baseSpread + topSpread) * 0.5, baseY - h * 0.14, cx + topSpread, crownY + ry * 0.35);
                    bctx.stroke();

                    bctx.strokeStyle = "rgba(148, 106, 72, 0.45)";
                    bctx.lineWidth = 1.0;
                    bctx.beginPath();
                    bctx.moveTo(cx + baseSpread - 1, baseY - 2);
                    bctx.lineTo(cx + topSpread - 1, crownY + ry * 0.45);
                    bctx.stroke();
                });

                const coreGrad = bctx.createRadialGradient(cx, crownY + 6, rx * 0.1, cx, crownY + 4, rx * 0.92);
                coreGrad.addColorStop(0, "#071a0b");
                coreGrad.addColorStop(0.75, "#0d2913");
                coreGrad.addColorStop(1, "rgba(10, 32, 15, 0)");
                bctx.fillStyle = coreGrad;
                bctx.beginPath();
                bctx.ellipse(cx, crownY + 4, rx * 0.90, ry * 0.85, 0, 0, Math.PI * 2);
                bctx.fill();

                const tiers = isDusk
                    ? [
                        { count: 55, fill: "#0a2112", vein: null, yMin: -0.15, yMax: 0.72, len: 12, wid: 4.5 },
                        { count: 65, fill: "#13381f", vein: "#1f522d", yMin: -0.35, yMax: 0.55, len: 13, wid: 4.8 },
                        { count: 70, fill: "#21592e", vein: "#367d42", yMin: -0.58, yMax: 0.32, len: 12.5, wid: 4.6 },
                        { count: 65, fill: "#387d3b", vein: "#68b054", yMin: -0.78, yMax: 0.05, len: 11.5, wid: 4.2 },
                        { count: 50, fill: "#78a842", vein: "#c9cf58", yMin: -0.92, yMax: -0.32, len: 10.5, wid: 3.8 }
                    ]
                    : [
                        { count: 55, fill: "#092410", vein: null, yMin: -0.15, yMax: 0.72, len: 12, wid: 4.5 },
                        { count: 65, fill: "#14421d", vein: "#23632e", yMin: -0.35, yMax: 0.55, len: 13, wid: 4.8 },
                        { count: 70, fill: "#246b2e", vein: "#3e9146", yMin: -0.58, yMax: 0.32, len: 12.5, wid: 4.6 },
                        { count: 65, fill: "#3b8f3b", vein: "#6bc254", yMin: -0.78, yMax: 0.05, len: 11.5, wid: 4.2 },
                        { count: 55, fill: "#62b842", vein: "#a7e85c", yMin: -0.92, yMax: -0.32, len: 10.5, wid: 3.8 }
                    ];

                for (let tIdx = 0; tIdx < tiers.length; tIdx++) {
                    const tier = tiers[tIdx];
                    for (let i = 0; i < tier.count; i++) {
                        const u = (rng() * 2 - 1);
                        const horizFactor = Math.pow(Math.abs(u), 0.75) * Math.sign(u);
                        const lx = cx + horizFactor * rx * (0.94 - tIdx * 0.03) + (rng() - 0.5) * 6;
                        const tableArch = (1 - Math.pow(u, 2) * 0.65);
                        const vFrac = lerp(tier.yMin, tier.yMax, rng());
                        const ly = crownY + vFrac * ry * tableArch + (1 - tableArch) * ry * 0.28;

                        const leafAngle = u * 0.65 + (rng() - 0.5) * 0.85;
                        const lLen = tier.len * (0.82 + rng() * 0.36);
                        const lWid = tier.wid * (0.82 + rng() * 0.36);
                        drawSingleTeaLeaf(bctx, lx, ly, lLen, lWid, leafAngle, tier.fill, tier.vein);
                    }
                }

                const shootCount = 24;
                for (let s = 0; s < shootCount; s++) {
                    const u = ((s / (shootCount - 1)) * 2 - 1) * 0.88 + (rng() - 0.5) * 0.08;
                    const tableArch = 1 - Math.pow(u, 2) * 0.55;
                    const sx = cx + u * rx * 0.92;
                    const sy = crownY - ry * 0.68 * tableArch + (rng() - 0.5) * 5;

                    const leafCol1 = isDusk ? "#d4b84a" : "#9be346";
                    const leafCol2 = isDusk ? "#f0c85b" : "#bdf55c";
                    const budCol = isDusk ? "#ffe48a" : "#e6fc9a";

                    drawSingleTeaLeaf(bctx, sx - 3.2, sy + 1.5, 7.5, 2.6, -0.55, leafCol1, budCol);
                    drawSingleTeaLeaf(bctx, sx + 3.2, sy + 1.5, 7.5, 2.6, 0.55, leafCol2, budCol);

                    bctx.fillStyle = budCol;
                    bctx.beginPath();
                    bctx.ellipse(sx, sy - 3.2, 1.4, 4.6, (rng() - 0.5) * 0.15, 0, Math.PI * 2);
                    bctx.fill();
                }

                return c;
            }

            const teaBushSpritesDay = [

            function createShadeCanopySprite(w, h, seed, palette, isFeathery = true) {
                const c = createOffscreen(w, h);

                const cx = w * 0.5;
                const cy = h * 0.54;

                const tiers = isFeathery

                        { ox: rx * 0.45, oy: ry * 0.14, sx: 0.55, sy: 0.32 },
                        { ox: -rx * 0.25, oy: -ry * 0.16, sx: 0.62, sy: 0.34 },
                        { ox: rx * 0.24, oy: -ry * 0.18, sx: 0.60, sy: 0.34 },
                        { ox: 0, oy: -ry * 0.38, sx: 0.66, sy: 0.32 },
                        { ox: 0, oy: ry * 0.08, sx: 0.72, sy: 0.35 }
                    ]
                    : [
                        { ox: -rx * 0.38, oy: ry * 0.12, sx: 0.52, sy: 0.48 },
                        { ox: rx * 0.38, oy: ry * 0.14, sx: 0.50, sy: 0.48 },

                for (let tIdx = 0; tIdx < palette.length; tIdx++) {

                    for (let i = 0; i < count; i++) {
                        const lobe = tiers[(i + tIdx) % tiers.length];
                        const ang = rng() * Math.PI * 2;
                        const d = Math.pow(rng(), 0.62) * (1 - lift * 0.16);
                        const lx = cx + lobe.ox - lift * 10 + Math.cos(ang) * rx * lobe.sx * d + (rng() - 0.5) * 9;
                        const ly = cy + lobe.oy - lift * 12 + Math.sin(ang) * ry * lobe.sy * d + (rng() - 0.5) * 6;

                        lctx.save();
                        lctx.translate(lx, ly);
                        lctx.rotate((rng() - 0.5) * 0.35);
                        const lw = (isFeathery ? 13 : 9) + rng() * 9;

                        lctx.beginPath();
                        lctx.ellipse(0, 0, lw, lh, 0, 0, Math.PI * 2);
                        lctx.fill();
                        lctx.restore();
                    }
                }
                return c;
            }

            const koroiCanopyA = createShadeCanopySprite(310, 180, 101, ["#0b2218", "#133826", "#1d5434", "#2e7842", "#52a34c", "#8fd45e"], true);

            const grainCanvas = createOffscreen(180, 180);
            function renderGrainTexture() {
                const gctx = grainCanvas.getContext("2d");
                const img = gctx.createImageData(180, 180);
                const d = img.data;
                const rng = mulberry32(4049);
                for (let i = 0; i < d.length; i += 4) {
                    const v = (rng() * 255) | 0;
                    d[i] = v;
                    d[i + 1] = Math.max(0, v - 5);
                    d[i + 2] = Math.max(0, v - 14);
                    d[i + 3] = 11;

            // ============================================================================
            // 4B. REALISTIC MULTI-BUSH TILLA HILLOCK BUILDER (INDIVIDUAL TEA PLANTS!)
            // ============================================================================
            function drawRealisticTeaTilla(ctx, opts) {
                const {
                    cx, baseY, rx, ry, rowCount = 9, seed = 1,
                    isDusk = false, hasFootpath = false, pathOffset = 0,
                    minBushScale = 0.28, maxBushScale = 0.72
                } = opts;

                const rng = mulberry32(seed * 919);
                const sprites = isDusk ? teaBushSpritesDusk : teaBushSpritesDay;

                ctx.save();

                const earthGrad = ctx.createLinearGradient(cx, baseY - ry, cx, baseY + 30);
                if (isDusk) {
                    earthGrad.addColorStop(0, "#4a2515");
                    earthGrad.addColorStop(0.5, "#33180d");
                    earthGrad.addColorStop(1, "#140905");
                } else {
                    earthGrad.addColorStop(0, "#8f4928");
                    earthGrad.addColorStop(0.55, "#6b3319");
                    earthGrad.addColorStop(1, "#2d1409");
                }
                ctx.fillStyle = earthGrad;
                ctx.beginPath();
                ctx.moveTo(cx - rx * 1.05, baseY + 40);
                for (let x = -rx; x <= rx; x += 16) {
                    const u = x / rx;
                    const dome = Math.cos(u * Math.PI * 0.5);
                    const n = noise2D((cx + x) * 0.005, seed * 3.7) * 14;
                    ctx.lineTo(cx + x, baseY - dome * ry + n);
                }
                ctx.lineTo(cx + rx * 1.05, baseY + 40);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(cx - rx * 1.08, baseY + 50);
                for (let x = -rx * 1.05; x <= rx * 1.05; x += 18) {
                    const u = clamp(x / rx, -1, 1);
                    const dome = Math.cos(u * Math.PI * 0.5);
                    const n = noise2D((cx + x) * 0.005, seed * 3.7) * 14;
                    ctx.lineTo(cx + x, baseY - dome * ry + n - 48);
                }
                ctx.lineTo(cx + rx * 1.08, baseY + 50);
                ctx.closePath();
                ctx.clip();

                function getPathX(frac) {
                    return cx + pathOffset + Math.sin(frac * Math.PI * 1.65 + seed) * 52;
                }

                for (let r = 0; r < rowCount; r++) {
                    const frac = r / Math.max(1, rowCount - 1);
                    const perspFrac = Math.pow(frac, 1.12);
                    const rowYOffset = perspFrac * (ry * 0.96);
                    const bScale = lerp(minBushScale, maxBushScale, perspFrac);
                    const bushW = 138 * bScale;
                    const bushH = 98 * bScale;
                    const stepX = bushW * 0.68;

                    ctx.strokeStyle = isDusk ? "#592b18" : "#a65832";
                    ctx.lineWidth = Math.max(2.5, 8 * bScale);
                    ctx.beginPath();
                    for (let x = -rx; x <= rx; x += 20) {
                        const u = x / rx;
                        const dome = Math.cos(u * Math.PI * 0.5);
                        const wave = Math.sin(u * 4.2 + r * 0.45 + seed) * 5;
                        const py = baseY - dome * ry + rowYOffset + wave + bushH * 0.28;
                        if (x === -rx) ctx.moveTo(cx + x, py);
                        else ctx.lineTo(cx + x, py);
                    }
                    ctx.stroke();

                    ctx.strokeStyle = "rgba(12, 8, 5, 0.72)";
                    ctx.lineWidth = Math.max(1.8, 5 * bScale);
                    ctx.stroke();

                    const pathCenterX = getPathX(perspFrac);
                    const pathGapHalf = hasFootpath ? lerp(12, 26, perspFrac) : -1;

                    for (let x = -rx + (r % 2) * (stepX * 0.45); x <= rx; x += stepX) {
                        const worldX = cx + x + (rng() - 0.5) * (stepX * 0.18);
                        const u = clamp((worldX - cx) / rx, -1, 1);

                        if (hasFootpath && Math.abs(worldX - pathCenterX) < pathGapHalf) {
                            ctx.fillStyle = isDusk ? "#6e3820" : "#c47247";
                            ctx.fillRect(pathCenterX - pathGapHalf * 0.7, baseY - Math.cos(u * Math.PI * 0.5) * ry + rowYOffset, pathGapHalf * 1.4, Math.max(2, 4.5 * bScale));
                            continue;
                        }

                        const dome = Math.cos(u * Math.PI * 0.5);
                        const wave = Math.sin(u * 4.2 + r * 0.45 + seed) * 5;
                        const worldY = baseY - dome * ry + rowYOffset + wave + (rng() - 0.5) * 3;

                        const slopeTilt = u * 0.18 + (rng() - 0.5) * 0.05;
                        const spr = sprites[(r * 7 + Math.abs(Math.floor(x))) % sprites.length];
                        const scVar = bScale * (0.92 + rng() * 0.16);

                        ctx.save();
                        ctx.translate(worldX, worldY);
                        ctx.rotate(slopeTilt);
                        ctx.drawImage(
                            spr,
                            -spr.width * 0.5 * scVar,
                            -spr.height * 0.78 * scVar,
                            spr.width * scVar,
                            spr.height * scVar
                        );
                        ctx.restore();
                    }
                }

                ctx.restore();
            }

            // ============================================================================
            // 5. ANATOMICAL TEA ESTATE WORKER (CHA SRAMIK) WITH FOREHEAD-STRAPPED TUKRI
            // ============================================================================
            function drawTeaWorker(ctx, opts) {
                const {
                    x, y, scale = 1.0, dir = 1, t = 0, phase = 0,
                    sariColor = "#c0392b", borderColor = "#f5d061", blouseColor = "#8e241b",
                    mode = "plucking",
                    hasTukri = true, hasUmbrellaHat = false
                } = opts;

                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale * dir, scale);

                const isWalking = mode === "walking";
                const isPlucking = mode === "plucking";
                const walkCycle = t * 7.2 + phase;
                const pluckCycle = (t * 2.4 + phase) % 1;
                const bob = isWalking ? Math.abs(Math.cos(walkCycle)) * 2.5 : Math.sin(t * 2.8 + phase) * 0.9;

                if (isWalking || mode === "standing") {
                    ctx.fillStyle = "rgba(10, 18, 12, 0.34)";
                    ctx.beginPath();
                    ctx.ellipse(0, 2, 16, 4.8, 0, 0, Math.PI * 2);
                    ctx.fill();

                    const stride = isWalking ? Math.sin(walkCycle) * 7.5 : 0;
                    ctx.strokeStyle = "#6e4228";
                    ctx.lineWidth = 4.2;
                    ctx.lineCap = "round";
                    ctx.beginPath();
                    ctx.moveTo(-2, -24 - bob);
                    ctx.lineTo(-2 - stride, 0);
                    ctx.moveTo(2, -24 - bob);
                    ctx.lineTo(2 + stride, 0);
                    ctx.stroke();
                }

                if (hasTukri) {
                    ctx.save();
                    ctx.translate(-15, -42 - bob);
                    ctx.rotate(-0.22 + (isWalking ? Math.sin(walkCycle) * 0.04 : 0));

                    const leafMoundGrad = ctx.createLinearGradient(0, -24, 0, -8);
                    leafMoundGrad.addColorStop(0, "#b8f252");
                    leafMoundGrad.addColorStop(0.6, "#6ebd32");
                    leafMoundGrad.addColorStop(1, "#39731e");
                    ctx.fillStyle = leafMoundGrad;
                    ctx.beginPath();
                    ctx.arc(0, -14, 14.5, Math.PI, 0);
                    ctx.fill();

                    ctx.fillStyle = "#c8f764";
                    [-9, -4, 1, 6, 10].forEach((lx, idx) => {
                        ctx.beginPath();
                        ctx.ellipse(lx, -19 - (idx % 2) * 2.5, 4.2, 2.0, (idx - 2) * 0.3, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    const tukriGrad = ctx.createLinearGradient(-16, -15, 16, 20);
                    tukriGrad.addColorStop(0, "#d9ae66");
                    tukriGrad.addColorStop(0.5, "#b5853b");
                    tukriGrad.addColorStop(1, "#78531e");
                    ctx.fillStyle = tukriGrad;
                    ctx.beginPath();
                    ctx.moveTo(-15.5, -14);
                    ctx.lineTo(15.5, -14);
                    ctx.quadraticCurveTo(13, 6, 7.5, 20);
                    ctx.lineTo(-7.5, 20);
                    ctx.quadraticCurveTo(-13, 6, -15.5, -14);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = "#5c3d12";
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(-16, -14);
                    ctx.lineTo(16, -14);
                    ctx.stroke();

                    ctx.strokeStyle = "rgba(82, 52, 16, 0.48)";
                    ctx.lineWidth = 1.1;
                    for (let wy = -8; wy <= 15; wy += 5.5) {
                        const wHalf = lerp(14.5, 7.5, (wy + 14) / 34);
                        ctx.beginPath();
                        ctx.moveTo(-wHalf, wy);
                        ctx.lineTo(wHalf, wy);
                        ctx.stroke();
                    }
                    for (let wx = -10; wx <= 10; wx += 5) {
                        ctx.beginPath();
                        ctx.moveTo(wx, -14);
                        ctx.lineTo(wx * 0.5, 19);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                const hipY = -22 - bob;
                const shY = -48 - bob;

                ctx.fillStyle = sariColor;
                ctx.beginPath();
                ctx.moveTo(-9, hipY);
                ctx.lineTo(9, hipY);
                ctx.lineTo(11, -3 - bob * 0.3);
                ctx.lineTo(-10, -3 - bob * 0.3);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = borderColor;
                ctx.fillRect(-10, -6.5 - bob * 0.3, 21, 3.5);

                ctx.fillStyle = blouseColor;
                ctx.beginPath();
                ctx.roundRect(-8.5, shY, 17, hipY - shY + 3, 4);
                ctx.fill();

                ctx.fillStyle = sariColor;
                ctx.beginPath();
                ctx.moveTo(-8.5, shY + 1);
                ctx.lineTo(4, shY + 1);
                ctx.lineTo(8.5, hipY);
                ctx.lineTo(-6, hipY);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(-7.5, shY + 1);
                ctx.lineTo(7.5, hipY);
                ctx.stroke();

                const headY = shY - 12;
                ctx.fillStyle = "#6e4228";
                ctx.fillRect(-2.5, shY - 5, 5, 6);

                ctx.fillStyle = "#161210";
                ctx.beginPath();
                ctx.arc(-8.5, headY + 1, 5.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#f59e0b";
                ctx.beginPath();
                ctx.arc(-6.5, headY - 2, 2.0, 0, Math.PI * 2);
                ctx.arc(-6.0, headY + 2, 2.0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#7c4b2e";
                ctx.beginPath();
                ctx.arc(0, headY, 7.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#161210";
                ctx.beginPath();
                ctx.arc(-1, headY - 1.5, 7.4, Math.PI * 0.75, Math.PI * 2.05);
                ctx.fill();

                ctx.fillStyle = "#d9261c";
                ctx.beginPath();
                ctx.arc(6.5, headY - 2.4, 1.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#120e0c";
                ctx.beginPath();
                ctx.arc(4.5, headY - 0.8, 1.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#fde047";
                ctx.beginPath();
                ctx.arc(6.8, headY + 1.5, 0.85, 0, Math.PI * 2);
                ctx.fill();

                if (hasTukri) {
                    ctx.strokeStyle = "#d4a85c";
                    ctx.lineWidth = 2.6;
                    ctx.beginPath();
                    ctx.moveTo(5.2, headY - 5.2);
                    ctx.quadraticCurveTo(-5, headY + 2, -16, shY + 6);
                    ctx.stroke();
                }

                if (hasUmbrellaHat) {
                    ctx.fillStyle = "#d4ad60";
                    ctx.beginPath();
                    ctx.moveTo(-18, headY - 5);
                    ctx.quadraticCurveTo(0, headY - 19, 18, headY - 5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = "#78531e";
                    ctx.lineWidth = 1.4;
                    ctx.stroke();
                }

                let elX, elY, handX, handY;
                if (isPlucking) {
                    if (pluckCycle < 0.68) {
                        const p = pluckCycle / 0.68;
                        const reachWave = Math.sin(p * Math.PI * 2);
                        elX = 7 + reachWave * 3;
                        elY = shY + 11;
                        handX = 19 + reachWave * 6;
                        handY = shY + 12 + Math.cos(p * Math.PI * 2) * 3;
                    } else {
                        const u = (pluckCycle - 0.68) / 0.32;
                        const tossArc = Math.sin(u * Math.PI);
                        elX = lerp(8, -2, tossArc);
                        elY = lerp(shY + 10, shY - 8, tossArc);
                        handX = lerp(20, -11, tossArc);
                        handY = lerp(shY + 11, shY - 16, tossArc);

                        if (u > 0.32 && u < 0.92) {
                            const lu = (u - 0.32) / 0.6;
                            const lx = lerp(-6, -16, lu);
                            const ly = lerp(shY - 16, shY + 2, lu) - Math.sin(lu * Math.PI) * 10;
                            ctx.fillStyle = "#b8f252";
                            ctx.beginPath();
                            ctx.ellipse(lx, ly, 4.2, 2.0, lu * 2.5, 0, Math.PI * 2);
                            ctx.ellipse(lx + 3, ly - 2, 3.5, 1.6, -lu * 2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                } else {
                    const swing = isWalking ? Math.sin(walkCycle) * 5 : 0;
                    elX = 4 + swing * 0.5;
                    elY = shY + 10;
                    handX = 6 + swing;
                    handY = headY - 2;
                }

                ctx.strokeStyle = blouseColor;
                ctx.lineWidth = 5.2;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(1, shY + 3);
                ctx.lineTo(lerp(1, elX, 0.72), lerp(shY + 3, elY, 0.72));
                ctx.stroke();

                ctx.strokeStyle = "#7c4b2e";
                ctx.lineWidth = 3.6;
                ctx.beginPath();
                ctx.moveTo(lerp(1, elX, 0.68), lerp(shY + 3, elY, 0.68));
                ctx.lineTo(elX, elY);
                ctx.lineTo(handX, handY);
                ctx.stroke();

                const wrX = lerp(elX, handX, 0.78);
                const wrY = lerp(elY, handY, 0.78);
                ctx.strokeStyle = "#ef4444";
                ctx.lineWidth = 2.0;
                ctx.beginPath();
                ctx.moveTo(wrX - 1, wrY - 2);
                ctx.lineTo(wrX + 1, wrY + 2);
                ctx.stroke();
                ctx.strokeStyle = "#fde047";
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(wrX + 0.5, wrY - 2);
                ctx.lineTo(wrX + 2.2, wrY + 2);
                ctx.stroke();

                ctx.fillStyle = "#7c4b2e";
                ctx.beginPath();
                ctx.arc(handX, handY, 2.4, 0, Math.PI * 2);
                ctx.fill();
                if (isPlucking && pluckCycle < 0.75) {
                    ctx.fillStyle = "#c8f764";
                    ctx.beginPath();
                    ctx.ellipse(handX + 3.5, handY - 2, 4.0, 1.8, -0.4, 0, Math.PI * 2);
                    ctx.ellipse(handX + 1.5, handY - 4, 3.2, 1.5, 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // ============================================================================
            // 6. CUT 1 (0:00–0:05) & CUT 6 (0:25–0:30): MULTI-PLANE TILLA PANORAMA
            // ============================================================================
            const TILLA_FIREFLIES = Array.from({ length: 75 }, (_, i) => ({
                x: 80 + ((i * 193) % 1440),

                phase: i * 0.65,

            }));

            function renderCut1And6TillaPanorama(ctx, t, isCut6 = false) {
                const localU = isCut6 ? clamp((t - 25.0) / 5.0, 0, 1) : clamp(t / 5.0, 0, 1);
                const duskAmt = isCut6 ? smoothstep(0.0, 0.72, localU) : 0;
                const nightAmt = isCut6 ? smoothstep(0.35, 0.92, localU) : 0;

                const zoom = isCut6 ? lerp(1.24, 1.01, easeInOutCubic(localU)) : lerp(1.01, 1.25, easeInOutCubic(localU));
                const panX = isCut6 ? lerp(42, -32, easeInOutCubic(localU)) : lerp(-38, 42, easeInOutCubic(localU));
                const panY = isCut6 ? lerp(24, -12, easeInOutCubic(localU)) : lerp(-18, 26, easeInOutCubic(localU));
                const bankAngle = isCut6
                    ? Math.sin(localU * Math.PI) * -0.010
                    : Math.sin(localU * Math.PI) * 0.016;

                ctx.save();
                ctx.translate(CW * 0.5, CH * 0.5);
                ctx.rotate(bankAngle);
                ctx.scale(zoom, zoom);
                ctx.translate(-CW * 0.5 - panX * 0.5, -CH * 0.5 - panY * 0.5);

                const skyGrad = ctx.createLinearGradient(0, -60, 0, 410);
                if (isCut6) {
                    skyGrad.addColorStop(0, lerpColor([38, 54, 108], [12, 18, 42], nightAmt));
                    skyGrad.addColorStop(0.48, lerpColor([218, 96, 72], [68, 42, 78], nightAmt));
                    skyGrad.addColorStop(1, lerpColor([255, 196, 92], [188, 92, 58], nightAmt));
                } else {
                    skyGrad.addColorStop(0, "#1d5c78");
                    skyGrad.addColorStop(0.45, "#5eb0ba");
                    skyGrad.addColorStop(0.82, "#cbead2");
                    skyGrad.addColorStop(1, "#fff2c2");
                }
                ctx.fillStyle = skyGrad;
                ctx.fillRect(-140, -80, CW + 280, 500);

                const sunX = isCut6 ? lerp(1160, 1240, localU) : lerp(410, 520, localU);
                const sunY = isCut6 ? lerp(165, 290, localU) : lerp(195, 130, localU);
                const sunHalo = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 320);
                if (isCut6) {
                    sunHalo.addColorStop(0, `rgba(255, 235, 170, ${0.95 - nightAmt * 0.45})`);
                    sunHalo.addColorStop(0.28, `rgba(255, 148, 68, ${0.65 - nightAmt * 0.35})`);
                    sunHalo.addColorStop(1, "rgba(180, 60, 50, 0)");
                } else {
                    sunHalo.addColorStop(0, "rgba(255, 252, 225, 0.95)");
                    sunHalo.addColorStop(0.25, "rgba(235, 248, 195, 0.58)");
                    sunHalo.addColorStop(1, "rgba(180, 230, 175, 0)");
                }
                ctx.fillStyle = sunHalo;
                ctx.beginPath();
                ctx.arc(sunX, sunY, 320, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.translate(-panX * 0.15, 0);
                ctx.fillStyle = isCut6 ? lerpColor([58, 72, 102], [22, 28, 52], nightAmt) : "#4d7c7d";
                ctx.beginPath();
                ctx.moveTo(-120, 390);
                for (let x = -120; x <= CW + 120; x += 25) {
                    const h = Math.sin(x * 0.0045) * 45 + Math.cos(x * 0.011) * 22 + noise2D(x * 0.008, 1.2) * 25;
                    ctx.lineTo(x, 295 - h);
                }
                ctx.lineTo(CW + 120, 410);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                ctx.save();

            // ============================================================================

            function getCut3StreamChannel(y) {
                const u = clamp((y - 385) / 565, 0, 1);
                const center = 800 + Math.sin(u * Math.PI * 1.45 - 0.35) * (62 * (0.4 + u * 0.6));
                const halfW = lerp(118, 700, Math.pow(u, 0.92));
                return { u, center, left: center - halfW, right: center + halfW, halfW };
            }

            const JHIRI_PEBBLES = Array.from({ length: 190 }, (_, i) => {
                const rng = mulberry32(9001 + i);
                const u = Math.pow(rng(), 0.78);
                const y = 415 + u * 515;
                const ch = getCut3StreamChannel(y);
                const spread = (rng() * 2 - 1) * 0.92;
                const x = ch.center + spread * ch.halfW;
                const scale = lerp(0.45, 1.35, u);
                const palettes = [
                    { base: "#9c744f", hi: "#d6b087", sh: "#3d2917" },
                    { base: "#64748b", hi: "#94a3b8", sh: "#1e293b" },
                    { base: "#786855", hi: "#b09e86", sh: "#2e261d" },
                    { base: "#8c583a", hi: "#c28863", sh: "#381f11" },
                    { base: "#526656", hi: "#849c89", sh: "#1c261e" }
                ];
                const pal = palettes[i % palettes.length];
                return {
                    x, y, u,
                    rx: (6.5 + rng() * 14.5) * scale,
                    ry: (3.8 + rng() * 7.8) * scale,
                    ang: (rng() - 0.5) * 0.65,
                    base: pal.base,
                    hi: pal.hi,
                    sh: pal.sh,
                    glint: rng() > 0.72
                };
            });

            const JHIRI_MINNOWS = Array.from({ length: 14 }, (_, i) => {
                const rng = mulberry32(4321 + i);
                return {
                    baseU: 0.25 + rng() * 0.65,
                    laneOffset: (rng() - 0.5) * 0.52,
                    speed: 0.08 + rng() * 0.06,
                    phase: rng() * Math.PI * 2,
                    size: 0.85 + rng() * 0.45
                };
            });

            function drawBambooGroveCluster(ctx, baseX, baseY, scale, dir, sway) {
                ctx.save();
                ctx.translate(baseX, baseY);
                ctx.scale(scale, scale);

                const culms = [-22, -11, 0, 10, 21];
                culms.forEach((cx, idx) => {
                    const h = 220 + (idx % 3) * 32;
                    const tipX = cx + dir * (48 + idx * 14) + sway * (0.8 + idx * 0.15);
                    const tipY = -h + Math.abs(idx - 2) * 14;

                    ctx.strokeStyle = idx % 2 === 0 ? "#3f7a2c" : "#559938";
                    ctx.lineWidth = 4.6 - idx * 0.35;
                    ctx.lineCap = "round";
                    ctx.beginPath();
                    ctx.moveTo(cx, 0);
                    ctx.quadraticCurveTo(cx + dir * 16, -h * 0.55, tipX, tipY);
                    ctx.stroke();

                    // Bamboo nodes & feathery leaf sprays along upper culm
                    for (let seg = 1; seg <= 6; seg++) {
                        const su = seg / 6;
                        const nx = (1 - su) * (1 - su) * cx + 2 * (1 - su) * su * (cx + dir * 16) + su * su * tipX;
                        const ny = (1 - su) * (1 - su) * 0 + 2 * (1 - su) * su * (-h * 0.55) + su * su * tipY;
                        ctx.fillStyle = "#254d19";
                        ctx.fillRect(nx - 2.4, ny - 1, 4.8, 2);

                        if (seg >= 3) {
                            for (let lf = -1; lf <= 1; lf += 2) {
                                const lAng = dir * 0.45 + lf * 0.48 + sway * 0.015;

                                    ctx,

                                    ny - 3,
                                    22,
                                    3.6,
                                    lAng,
                                    seg % 2 === 0 ? "#68bd42" : "#8ce05a",
                                    null
                                );
                            }
                        }
                    }
                });

                ctx.restore();
            }

            function drawSculptedJhiriBoulder(ctx, bd, t) {
                const { x, y, rx, ry, hasMoss = true, seed = 1 } = bd;
                const foamPulse = Math.sin(t * 6.8 + seed) * 3.5;

                ctx.save();
                ctx.translate(x, y);

                ctx.strokeStyle = "rgba(232, 253, 255, 0.38)";

                for (let w = 0; w < 3; w++) {

                rockGrad.addColorStop(0, "#7b8a99");
                rockGrad.addColorStop(0.45, "#475569");
                rockGrad.addColorStop(0.8, "#293548");
                rockGrad.addColorStop(1, "#151e2b");

                ctx.beginPath();

                ctx.moveTo(-rx * 0.82, -ry * 0.08);

                ctx.fill();

                ctx.strokeStyle = "rgba(12, 20, 28, 0.75)";
                ctx.lineWidth = 4.2;
                ctx.beginPath();
                ctx.ellipse(0, ry * 0.12, rx * 0.98, ry * 0.45, 0, 0.05, Math.PI - 0.05);

                    const mossGrad = ctx.createLinearGradient(0, -ry * 1.05, 0, -ry * 0.15);
                    mossGrad.addColorStop(0, "#7cd943");
                    mossGrad.addColorStop(0.55, "#3f8c27");
                    mossGrad.addColorStop(1, "#1e4d14");
                    ctx.fillStyle = mossGrad;
                    ctx.beginPath();
                    ctx.ellipse(-rx * 0.06, -ry * 0.46, rx * 0.76, ry * 0.44, -0.06, 0, Math.PI * 2);
                    ctx.fill();

                    // Velvety moss tufts along the crown
                    ctx.fillStyle = "#a3ed5a";
                    for (let m = -3; m <= 3; m++) {
                        const mx = m * (rx * 0.18);
                        const my = -ry * 0.64 + Math.abs(m) * (ry * 0.06);
                        ctx.beginPath();
                        ctx.arc(mx, my, 4.2 + (m % 2) * 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // 6. Foaming White-Water Collar & Animated Splash Beads
                ctx.strokeStyle = "rgba(245, 255, 255, 0.82)";
                ctx.lineWidth = 3.4;
                ctx.beginPath();
                ctx.ellipse(0, ry * 0.20, rx + 5 + foamPulse, ry * 0.50 + 2, 0, 0.08, Math.PI - 0.08);
                ctx.stroke();

                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                for (let sp = 0; sp < 5; sp++) {

            function renderCut3JhiriStream(ctx, t) {
                const localU = clamp((t - 10.0) / 5.0, 0, 1);

                ctx.fillStyle = valleyGlow;

                // 2. Flanking & Upper-Valley Tea Tillas (Individual Camellia sinensis Bushes!)
                ctx.save();
                ctx.translate(-driftX * 0.25, 0);
                ctx.drawImage(cut3RavineTillasCanvas, -100, 0);

                // Koroi Shade Trees & Arching Sylhet Muli-Bamboo Groves Framing the Ravine
                drawKoroiShadeTree(ctx, 240, 280, 0.86, Math.sin(t * 2.1) * 7, 0);
                drawKoroiShadeTree(ctx, 520, 330, 0.64, Math.cos(t * 1.9) * 5, 1);
                drawKoroiShadeTree(ctx, 1080, 325, 0.66, Math.sin(t * 2.0) * 5, 2);
                drawKoroiShadeTree(ctx, 1355, 275, 0.88, Math.cos(t * 2.0) * 7, 1);

                drawBambooGroveCluster(ctx, 390, 430, 0.82, 1, Math.sin(t * 2.4) * 8);

                // 3. Stratified Sandstone Gorge & Multi-Tier Upper Jhiri Waterfall / Cascade (Headwaters)

                        ctx.beginPath();

                        ctx.lineTo(sx * 1.002, tier.yTop + Math.min(tier.yBot - tier.yTop, syOff + 14));
                        ctx.stroke();
                    }

                    // Foaming aerated plunge cushion at base of tier
                    const mistR = tier.wBot * 0.56 + Math.sin(t * 8 + tIdx) * 5;
                    const plungeGrad = ctx.createRadialGradient(795, tier.yBot, 6, 795, tier.yBot, mistR);
                    plungeGrad.addColorStop(0, "rgba(255, 255, 255, 0.88)");

                    ctx.fillStyle = plungeGrad;

                // 4. Stratified Red-Laterite Ravine Banks & Wet Golden-Pebble Sandbars
                ctx.fillStyle = "#4a2513";

                ctx.lineTo(-100, CH + 90);

                // Exposed Golden-Ochre & Wet Sandstone Gravel Bars along the S-Curve Stream Edges
                ctx.fillStyle = "#b88a58";

                // Multi-stop emerald-jade-amber water depth gradient

                // A. Shallow Amber-Sand Shelf Glow along Left & Right Stream Edges
                for (const side of [-1, 1]) {

                // B. 3D Shaded Riverbed Sandstone & Slate Pebbles Visible Through Crystal Water
                for (const pb of JHIRI_PEBBLES) {

                }
                ctx.globalAlpha = 1.0;

                // C. Shimmering Underwater Sun-Caustic Light Ribbons
                ctx.save();

                ctx.strokeStyle = "rgba(215, 255, 220, 0.20)";

                ctx.restore();

                // D. Darting Silver Hill-Stream Minnows ("Pahari Puti / Chela Mach") + Riverbed Shadows
                for (const mn of JHIRI_MINNOWS) {

                    const my = lerp(475, 880, swimU);
                    const ch = getCut3StreamChannel(my);
                    const mx = ch.center + (mn.laneOffset + Math.sin(t * 2.1 + mn.phase) * 0.08) * ch.halfW;
                    const heading = -Math.PI * 0.5 + Math.cos(t * 2.1 + mn.phase) * 0.28;
                    const tailWag = Math.sin(t * 18 + mn.phase) * 0.35;
                    const sc = lerp(0.55, 1.25, swimU) * mn.size;

                    // Submerged fish shadow on the pebbles below
                    ctx.save();
                    ctx.translate(mx + 4, my + 8 * sc);
                    ctx.rotate(heading);
                    ctx.scale(sc, sc);
                    ctx.fillStyle = "rgba(6, 22, 18, 0.32)";
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 9, 2.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Translucent silver minnow body & wagging tail fin
                    ctx.save();
                    ctx.translate(mx, my);
                    ctx.rotate(heading);
                    ctx.scale(sc, sc);
                    ctx.fillStyle = "rgba(225, 248, 245, 0.78)";
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 9.5, 2.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "rgba(180, 230, 225, 0.65)";
                    ctx.beginPath();
                    ctx.moveTo(-8.5, 0);
                    ctx.lineTo(-14, -3.5 + tailWag * 4);
                    ctx.lineTo(-14, 3.5 + tailWag * 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                // E. Wave-Distorted Reflections of the Bamboo Bridge & Crossing Tea Workers
                const workerWalkU = ((t - 10.0) * 0.11) % 1;
                ctx.save();
                ctx.globalAlpha = 0.28;
                // Bridge deck reflection
                ctx.strokeStyle = "#9c783c";
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(350, 522);
                ctx.quadraticCurveTo(800, 536, 1250, 522);

                for (let w = 0; w < 3; w++) {
                    const wu = (workerWalkU + w * 0.24) % 1;

                // F. Flowing Surface Current Ribbons & Sunlit Specular Sparkles
                for (let i = 0; i < 80; i++) {

                // G. Sculpted 3D Mossy Sandstone Boulders & Stepping Stones in the Jhiri
                const boulders = [
                    { x: 645, y: 565, rx: 34, ry: 20, hasMoss: true, seed: 1 },
                    { x: 965, y: 580, rx: 38, ry: 22, hasMoss: true, seed: 2 },
                    { x: 515, y: 645, rx: 48, ry: 28, hasMoss: true, seed: 3 },

                    { x: 565, y: 865, rx: 42, ry: 22, hasMoss: false, seed: 8 }
                ];
                boulders.forEach(bd => drawSculptedJhiriBoulder(ctx, bd, t));

                // Expanding concentric water-droplet & water-strider ripple rings
                [

                    { x: 925, y: 705, p: 1.45 },
                    { x: 605, y: 825, p: 2.75 },

                ].forEach(st => {

                ctx.restore(); // End Jhiri Water Clip

                // 6. Bank Boulders, Stratified Mossy Ledges & Individual Tea Bushes Framing the Banks
                [
                    { x: 465, y: 495, rx: 32, ry: 18, hasMoss: true, seed: 11 },
                    { x: 1135, y: 498, rx: 34, ry: 19, hasMoss: true, seed: 12 },
                    { x: 315, y: 655, rx: 46, ry: 26, hasMoss: true, seed: 13 },
                    { x: 1295, y: 660, rx: 48, ry: 27, hasMoss: true, seed: 14 }
                ].forEach(bb => drawSculptedJhiriBoulder(ctx, bb, t));

                // Close-up Individual Camellia sinensis Tea Bushes Crowning Left & Right Ravine Terraces
                [
                    { x: 75, y: 525, sc: 0.78 }, { x: 185, y: 542, sc: 0.86 }, { x: 295, y: 528, sc: 0.80 },
                    { x: 135, y: 625, sc: 0.96 }, { x: 245, y: 640, sc: 0.92 },
                    { x: 1305, y: 528, sc: 0.80 }, { x: 1415, y: 542, sc: 0.86 }, { x: 1525, y: 525, sc: 0.78 },

                // 7. Authentic Arched Bamboo Footbridge ("Basher Shako") with Cross-Braced A-Frame Stilts
                ctx.save();

                // A. Cross-Braced A-Frame Bamboo Trestle Piers & Water-Surface Ripple Rings

                ctx.lineWidth = 5.5;
                ctx.beginPath();
                for (let bx = brLeftX; bx <= brRightX; bx += 18) {

                // Transverse woven bamboo deck slats & dark coir-rope lashings
                for (let sx = brLeftX + 8; sx <= brRightX - 8; sx += 11) {

                    ctx.lineWidth = 3.2;

                    ctx.moveTo(sx, sy - 5);
                    ctx.lineTo(sx, sy + 5);

                // D. Three Tea Pluckers ("Cha Sramik") Crossing the Arched Bamboo Shako
                const bridgeWorkers = [
                    { offset: 0.15, sari: "#d93829", border: "#fde047", blouse: "#7f1d1d", hat: false },
                    { offset: 0.39, sari: "#e67e22", border: "#fffbeb", blouse: "#7c2d12", hat: true },
                    { offset: 0.63, sari: "#8e44ad", border: "#facc15", blouse: "#4c1d95", hat: false }
                ];

                    const u = ((t - 10.0) * 0.11 + bw.offset) % 1;

                    drawTeaWorker(ctx, {
                        x: wx, y: wy, scale: 1.06, dir: 1, t, phase: idx * 1.7,

                    });

                // E. Near-Side (Foreground) Bamboo Handrail Posts, Coir Lashings & Segmented Rail (In Front of Workers)
